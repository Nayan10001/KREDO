name: KREDO CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run Ruff Lint
        run: |
          uv run ruff check backend

      - name: Run Pytest Unit Tests
        run: |
          uv run pytest backend/tests

      - name: Run Evaluation Harness Sanity Check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          JINA_READER_API_KEY: ${{ secrets.JINA_READER_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Run on a subset of 2 cases to verify sanity in CI without excessive token usage
          if [ -n "$GROQ_API_KEY" ]; then
            uv run python backend/scripts/run_eval.py 2
          else
            echo "Secrets not available (e.g. fork PR), skipping integration eval check."
          fi
